name = "esico-prototype"
main = "src/server/index.ts"
compatibility_date = "2026-09-01"


[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "esico-db"
database_id = "410dbc81-3d8c-4d57-841c-ffe84c04e523"
migrations_dir = "./migrations"

# Cloudflare R2 bucket configuration (uncomment and configure if needed) 
#[[r2_buckets]]
#binding = "ID_CARD_BUCKET"
#bucket_name = "id-cards-storage"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true


